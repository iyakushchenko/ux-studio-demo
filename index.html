
  <!DOCTYPE html>
  <html lang="en">
    <head>
      
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <script>
        /* Below the Figma S frame width the canvas SCALES instead of
           reflowing/clipping (PO 2026-08-06): a fixed 376 layout viewport
           makes the browser scale visually while 100vw bleeds stay true.
           Honored by mobile/emulated surfaces; desktop windows (>=500px)
           never hit it. */
        (function () {
          var meta = document.querySelector('meta[name="viewport"]');
          var apply = function () {
            var w = Math.min(window.screen.width, window.innerWidth || Infinity);
            meta.setAttribute(
              "content",
              w && w < 376 ? "width=376" : "width=device-width, initial-scale=1.0"
            );
          };
          apply();
          window.addEventListener("resize", apply);
        })();
      </script>
      <title>UXML</title>
      <meta name="description" content="Engine for clickable UX concepts, journey maps, and recorded scenarios. Boots Pharmacy is the first reference project." />
      <meta name="robots" content="noindex, nofollow" />
      <meta name="theme-color" content="#467672" />
      <link rel="icon" href="/ux-studio-demo/favicon.svg" type="image/svg+xml" />
      <link rel="apple-touch-icon" href="/ux-studio-demo/favicon.svg" />
      <style>
        /* overflow-y stays hidden (every scroll region is app-managed) — overflow-x
           is auto as a backstop for non-meta-honoring surfaces narrower than
           studio-app-root's min-width (--deck-frame-min-width); mobile/emulated
           surfaces never overflow (the viewport script above scales below 376). */
        html, body { height: 100%; margin: 0; overflow-y: hidden; overflow-x: auto; }
        #root { height: 100%; overflow-y: hidden; overflow-x: auto; }
      </style>
